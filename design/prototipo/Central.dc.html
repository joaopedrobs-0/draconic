<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Draconic — central de controle</title>

</head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000000}
.glass{background:rgba(246,246,247,0.72);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,0.7);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9), 0 16px 48px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.12)}

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; color: #1A1A1A">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  </div>

  <section role="dialog" aria-label="Central de controle" class="glass" style="position: absolute; top: 36px; right: 12px; width: 344px; box-sizing: border-box; padding: 8px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="grid-row: span 2; padding: 8px; border-radius: 12px; background: rgba(255,255,255,0.62); display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{conn}}" as="c" hint-placeholder-count="3">
          <button role="switch" aria-checked="{{c.on}}" style="display: flex; align-items: center; gap: 8px; padding: 0; background: transparent; border: none; font: inherit; text-align: left; color: #1A1A1A; cursor: pointer">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
            <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600; font-size: 12px">{{c.name}}</span><span style="font-size: 11px; color: #55555A">{{c.state}}</span></span>
          </button>
        </sc-for>
      </div>
      <button role="switch" aria-checked="false" style="padding: 8px; border-radius: 12px; border: none; background: rgba(255,255,255,0.62); display: flex; align-items: center; gap: 8px; font: inherit; text-align: left; color: #1A1A1A; cursor: pointer">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{i.moon}}"></path></svg></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 12px">Não perturbe</span><span style="font-size: 11px; color: #55555A">Desligado</span></span>
      </button>
      <button style="padding: 8px; border-radius: 12px; border: none; background: rgba(255,255,255,0.62); display: flex; align-items: center; gap: 8px; font: inherit; text-align: left; color: #1A1A1A; cursor: pointer">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{i.camera}}"></path></svg></span>

    </div>

    <sc-for list="{{sliders}}" as="s" hint-placeholder-count="2">
      <div style="padding: 8px 12px 12px; border-radius: 12px; background: rgba(255,255,255,0.62); display: flex; flex-direction: column; gap: 8px">

      </div>
    </sc-for>

        <button aria-label="Pausar" style="width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{i.pause}}"></path></svg></button>

      </span>
    </div>
    <a href="#" style="padding: 4px 8px 4px; font-size: 12px; color: #55555A; text-decoration: none">Configurações da central…</a>
  </section>

  <section aria-label="Notificações" style="position: absolute; top: 36px; right: 368px; width: 344px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px; height: 24px">
      <span style="font-size: 13px; font-weight: 600; color: #1A1A1A">Notificações</span>
      <button style="height: 24px; padding: 0 8px; border: none; border-radius: 12px; background: rgba(255,255,255,0.6); font: inherit; font-size: 12px; color: #1A1A1A; cursor: pointer">Limpar tudo</button>
    </div>
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <article class="glass" style="padding: 12px; border-radius: 16px; display: flex; gap: 12px">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; color: #1A1A1A"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; justify-content: space-between; font-size: 11px; color: #55555A"><span>{{n.app}}</span><span>{{n.time}}</span></span>
          <span style="font-size: 13px; font-weight: 600">{{n.title}}</span>
          <span style="font-size: 12px; color: #3A3A3D; line-height: 1.4">{{n.body}}</span>
          <sc-if value="{{n.hasAction}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; gap: 8px; margin-top: 8px">
              <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: none; background: #C8873A; color: #1A1A1A; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer">{{n.action}}</button>
              <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.7); color: #1A1A1A; font: inherit; font-size: 12px; cursor: pointer">Mais tarde</button>
            </span>
          </sc-if>
        </span>
      </article>
    </sc-for>
  </section>
</div>
</x-dc>
