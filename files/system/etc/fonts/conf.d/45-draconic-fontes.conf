<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontes padrão do Draconic (docs/design-system.md, seção Tipografia).
  Vale para todos os apps que usam fontconfig, não só os do KDE.
  O número 45 faz este arquivo ser lido antes das regras padrão do Fedora,
  então as famílias abaixo ganham a preferência.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
    </prefer>
  </alias>
</fontconfig>
