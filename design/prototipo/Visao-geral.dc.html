    </figure>
    <div style="display: flex; flex-direction: column; gap: 32px">
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">

        </span>

      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <span style="position: relative; display: block; width: 248px; height: 136px; overflow: hidden; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.45)">

        </span>
        <figcaption style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #D6D6D9"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{term}}"></path></svg>Terminal</figcaption>
      </figure>
    </div>
  </section>

  <label class="field" style="position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); width: 360px; height: 40px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 20px; color: #BDBDC1">

  </label>
  <span style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 12px; color: #8E8E93">Setas para escolher · Enter para abrir · Meta+1, 2, 3 para trocar de área</span>
</div>
