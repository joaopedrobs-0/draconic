      <span style="width: 24px; height: 24px; margin-right: 4px; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="16" viewBox="337 299 579 640" aria-hidden="true"><path fill="#1A1A1A" fill-rule="evenodd" d="{{mark}}"></path></svg>

      <span style="position: relative">
        <span style="height: 22px; padding: 0 8px; display: flex; align-items: center; border-radius: 5px; background: #C8873A">Arquivo</span>

          <sc-for list="{{items}}" as="m" hint-placeholder-count="12">
            <sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; margin: 4px 8px; background: rgba(0,0,0,0.1)"></span></sc-if>
            <sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
              <span role="menuitem" style="position: relative; height: 24px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; background: {{m.bg}}; color: {{m.fg}}">
                {{m.label}}
                <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: {{m.keyColor}}">{{m.key}}<sc-if value="{{m.sub}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg></sc-if></span>
                <sc-if value="{{m.open}}" hint-placeholder-val="{{ false }}">
                  <div role="menu" aria-label="Abrir com" class="menu" style="position: absolute; top: -4px; left: 268px; width: 232px; padding: 4px; border-radius: 8px; display: flex; flex-direction: column">
                    <sc-for list="{{sub}}" as="s" hint-placeholder-count="4">
                      <sc-if value="{{s.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; margin: 4px 8px; background: rgba(0,0,0,0.1)"></span></sc-if>
                      <sc-if value="{{s.item}}" hint-placeholder-val="{{ true }}">
                        <span role="menuitem" style="height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-radius: 4px; color: #1A1A1A">
                          <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{s.icon}}"></path></svg>{{s.label}}<span style="margin-left: auto; font-size: 12px; color: #55555A">{{s.note}}</span>
                        </span>
                      </sc-if>
                    </sc-for>
                  </div>
                </sc-if>
              </span>
            </sc-if>
          </sc-for>
        </div>
      </span>
      <span style="padding: 0 8px">Editar</span><span style="padding: 0 8px">Ver</span><span style="padding: 0 8px">Ir</span><span style="padding: 0 8px">Janela</span><span style="padding: 0 8px">Ajuda</span>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px">
      <span>PT</span>
      <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{wifi}}"></path></svg>
      <span>82%</span>
      <span>Seg 9 nov  21:40</span>
    </div>
  </header>
</div>
